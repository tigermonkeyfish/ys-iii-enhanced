name: game data scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: working tree
        run: python3 tools/scan.py --tree
      - name: whole history
        run: python3 tools/scan.py --history
